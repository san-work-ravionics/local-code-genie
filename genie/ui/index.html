<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genie Runs</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dc;
  --accent: #3b5bdb; --ok: #2f7d4f; --warn: #a86b00; --bad: #b42318; --block: #7a3fb0;
  --ok-bg: #e6f4ea; --warn-bg: #fdf1dc; --bad-bg: #fde8e6; --block-bg: #f1e8fa; --chip: #efeee9;
  --add: #e6f4ea; --del: #fde8e6; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9b9a93; --line: #34332f;
    --accent: #8ea6ff; --ok: #6cc88f; --warn: #e3a941; --bad: #f28b82; --block: #c39bec;
    --ok-bg: #1e3326; --warn-bg: #3a2d14; --bad-bg: #3d1f1c; --block-bg: #2e2238; --chip: #2a2a27;
    --add: #1e3326; --del: #3d1f1c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
header { display: flex; gap: 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; }
header .sub { color: var(--muted); font-size: 12px; }
select, button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
button { cursor: pointer; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.danger { color: var(--bad); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 12px 16px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.tile .k { color: var(--muted); font-size: 12px; }
.tile .v { font-size: 20px; font-weight: 600; margin-top: 2px; }
.tile .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
main { display: grid; grid-template-columns: minmax(260px, 380px) 1fr; gap: 12px; padding: 0 16px 24px; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; align-self: start; }
.run { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.run:last-child { border-bottom: 0; }
.run:hover, .run.sel { background: var(--chip); }
.run .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run .m { color: var(--muted); font-size: 12px; display: flex; gap: 8px; margin-top: 3px; flex-wrap: wrap; }
.chip { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: 12px; background: var(--chip); }
.s-pass, .s-needs_review, .s-accepted, .s-done { background: var(--ok-bg); color: var(--ok); }
.s-warn, .s-planned, .s-running, .s-no_change { background: var(--warn-bg); color: var(--warn); }
.s-fail, .s-failed, .s-rejected, .s-interrupted { background: var(--bad-bg); color: var(--bad); }
.s-cancelled { background: var(--chip); color: var(--muted); }
.s-blocked { background: var(--block-bg); color: var(--block); }
.s-skip { color: var(--muted); }
.detail { min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
.card h2 { font-size: 15px; margin: 0 0 8px; }
.card h3 { font-size: 13px; margin: 12px 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); }
.bar { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; width: 160px; display: inline-block; vertical-align: middle; }
.bar > i { display: block; height: 100%; background: var(--accent); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; }
code, pre { font-family: var(--mono); font-size: 12px; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; overflow: auto; max-height: 520px; margin: 0; white-space: pre; }
.diff .a { background: var(--add); display: block; }
.diff .d { background: var(--del); display: block; }
.diff .h { color: var(--accent); display: block; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.step { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; min-width: 120px; }
.step b { display: block; font-size: 12px; }
ul.tight { margin: 4px 0; padding-left: 18px; }
details summary { cursor: pointer; color: var(--accent); margin: 6px 0; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.msg { padding: 6px 10px; border-radius: 6px; margin-top: 8px; }
.left { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
form.newtask { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
form.newtask h2 { font-size: 14px; margin: 0; }
textarea, input[type=text] { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
textarea { min-height: 70px; resize: vertical; }
.opts { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.opts label { display: flex; gap: 4px; align-items: center; }
pre.live { max-height: 340px; white-space: pre-wrap; word-break: break-word; }
.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); animation: p 1.2s infinite; margin-right: 6px; }
@keyframes p { 50% { opacity: .25; } }
button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Genie</h1>
    <div class="sub">Local first, escalate when needed: every run, why it was routed that way, and what changed.</div>
  </div>
  <div style="flex:1"></div>
  <label class="muted">Target <select id="target"></select></label>
  <button id="refresh">Refresh</button>
</header>
<section class="tiles" id="tiles"></section>
<main>
  <div class="left">
    <form class="newtask" id="newtask">
      <h2>New task</h2>
      <textarea id="nt-task" placeholder="e.g. Add a GET /count endpoint to the system alerts router that returns {&quot;count&quot;: n}" required></textarea>
      <input type="text" id="nt-files" placeholder="Files to edit (optional, comma-separated, relative to the repo)">
      <input type="text" id="nt-test" placeholder="Test command (optional), e.g. python -m pytest -q tests/unit/test_api_system.py">
      <div class="opts">
        <label><input type="checkbox" id="nt-dry"> Plan only (dry run)</label>
        <label><input type="checkbox" id="nt-local"> Local only</label>
        <label><input type="checkbox" id="nt-fast"> Fast (3B)</label>
        <label><input type="checkbox" id="nt-remote"> Remote first</label>
        <label>Edit mode <select id="nt-mode"><option value="">auto</option><option value="insert">insert</option><option value="diff">diff</option></select></label>
      </div>
      <div class="row"><button class="primary" type="submit" id="nt-go">Run</button><span class="muted" id="nt-msg"></span></div>
    </form>
    <div class="list" id="list"><div class="empty">Loading…</div></div>
  </div>
  <div class="detail" id="detail"><div class="card empty">Select a run to see its timeline, checks and diff.</div></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x) => x == null ? "–" : Math.round(x * 100) + "%";
let state = { target: null, selected: null, runs: [], costs: { currency: "EUR", usd_to_eur: 0.92 } };
// Costs are stored in USD (as Aider reports them) and shown in the configured currency.
const money = (usd) => new Intl.NumberFormat("nl-NL", { style: "currency", currency: state.costs.currency,
  minimumFractionDigits: 2, maximumFractionDigits: 4 }).format((usd || 0) * (state.costs.currency === "EUR" ? state.costs.usd_to_eur : 1));

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function loadTargets() {
  const ts = await api("/api/targets");
  const sel = $("#target");
  sel.innerHTML = ts.map(t => `<option value="${esc(t.name)}" ${t.current ? "selected" : ""}>${esc(t.name)}</option>`).join("");
  state.target = sel.value || null;
  if (!ts.length) $("#list").innerHTML = `<div class="empty">No targets yet. Run <code>genie init &lt;repo&gt;</code>.</div>`;
}

function tiles(s) {
  const t = [
    ["Runs", s.total, Object.entries(s.status).map(([k, v]) => `${v} ${k.replace("_", " ")}`).join(" · ")],
    ["Solved locally", s.solved_local, `escalated / remote: ${s.solved_remote}`],
    ["Attempt pass rate", Object.entries(s.attempt_pass_rate).map(([k, v]) => `${k} ${v}`).join("  ") || "–", ""],
    ["Avg attempt time", Object.entries(s.avg_seconds).map(([k, v]) => `${k} ${v}s`).join("  ") || "–", ""],
    ["Remote spend", money(s.remote_cost_usd), `at ${state.costs.usd_to_eur} EUR per USD`],
    ["Top failing checks", Object.entries(s.checks_failed).slice(0, 3).map(([k, v]) => `${k} ${v}`).join(" · ") || "none", ""],
    ["Escalation reasons", Object.entries(s.escalation_reasons).slice(0, 2).map(([k, v]) => `${k} (${v})`).join(" · ") || "none", ""],
  ];
  $("#tiles").innerHTML = t.map(([k, v, sub]) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ""}</div>`).join("");
}

async function loadRuns() {
  if (!state.target) return;
  const j = await api(`/api/runs?target=${encodeURIComponent(state.target)}`);
  state.runs = j.runs;
  state.busy = j.busy;
  if (j.costs) state.costs = j.costs;
  $("#nt-msg").textContent = j.busy ? "A run is in progress; you can still do plan-only runs." : "";
  tiles(j.stats);
  if (!j.runs.length) {
    $("#list").innerHTML = `<div class="empty">No runs yet. Try <code>genie task "…" --dry-run</code>.</div>`;
    return;
  }
  $("#list").innerHTML = j.runs.map(r => `
    <div class="run ${r.id === state.selected ? "sel" : ""}" data-id="${esc(r.id)}">
      <div class="t">${esc(r.task)}</div>
      <div class="m">
        <span class="chip s-${esc(r.status)}">${esc((r.status || "").replace("_", " "))}</span>
        <span>${esc(r.route || r.planned_route || "")}</span>
        <span>coverage ${pct(r.coverage)}</span>
        ${r.seconds ? `<span>${r.seconds}s</span>` : ""}
        ${r.cost ? `<span>${money(r.cost)}</span>` : ""}
        <span>${esc((r.created || "").replace("T", " "))}</span>
      </div>
    </div>`).join("");
  document.querySelectorAll(".run").forEach(el => el.onclick = () => select(el.dataset.id));
}

function diffHtml(d) {
  return d.split("\n").map(l => {
    const c = l.startsWith("+++") || l.startsWith("---") ? "h" : l.startsWith("+") ? "a" : l.startsWith("-") ? "d" : l.startsWith("@@") ? "h" : "";
    return c ? `<span class="${c}">${esc(l)}</span>` : esc(l) + "\n";
  }).join("");
}

function checksTable(checks) {
  return `<table><tr><th>Check</th><th>Result</th><th>Detail</th></tr>${checks.map(c => `
    <tr><td><code>${esc(c.id)}</code></td><td><span class="chip s-${esc(c.status)}">${esc(c.status)}</span></td>
    <td>${esc(c.summary)}${c.details && c.details.length ? `<ul class="tight">${c.details.slice(0, 12).map(x => `<li><code>${esc(x)}</code></li>`).join("")}</ul>` : ""}</td></tr>`).join("")}</table>`;
}

const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Genie": "1" },
  body: JSON.stringify({ target: state.target, ...body }) });

async function startTask(body) {
  const r = await post("/api/task", body);
  state.selected = r.id;
  await loadRuns();
  await select(r.id);
  return r.id;
}

function elapsed(since) {
  const s = Math.max(0, Math.round((Date.now() - new Date(since).getTime()) / 1000));
  return s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`;
}

async function refreshLive(id) {
  const box = $("#live");
  if (!box) return;
  try {
    const j = await api(`/api/log?target=${encodeURIComponent(state.target)}&id=${encodeURIComponent(id)}`);
    const text = j.text || j.spawn_log || "Waiting for output…";
    const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
    box.textContent = text;
    if (atBottom) box.scrollTop = box.scrollHeight;
    $("#live-name").textContent = j.attempt_log ? `(${j.attempt_log})` : "";
  } catch (e) { /* ignore */ }
}

async function select(id) {
  state.selected = id;
  document.querySelectorAll(".run").forEach(el => el.classList.toggle("sel", el.dataset.id === id));
  const j = await api(`/api/run?target=${encodeURIComponent(state.target)}&id=${encodeURIComponent(id)}`);
  if (j.starting) {
    $("#detail").innerHTML = `<div class="card"><h2><span class="pulse"></span>Starting run…</h2><pre class="live">${esc(j.spawn_log || "")}</pre></div>`;
    return;
  }
  const d = j.run, f = j.files;
  const running = d.status === "running";
  const canAct = (d.status === "needs_review" || d.status === "failed" || d.status === "blocked" || d.status === "cancelled") && d.branch;
  const canAccept = canAct && d.status !== "cancelled";
  const current = running ? (d.steps || []).filter(s => s.status === "running").slice(-1)[0] : null;
  const reasons = (d.escalation_reasons || []);
  $("#detail").innerHTML = `
    <div class="card">
      <h2>${esc(d.task)}</h2>
      <div class="row">
        <span class="chip s-${esc(d.status)}">${esc((d.status || "").replace("_", " "))}</span>
        <span class="muted">route</span> <b>${esc(d.route || d.planned_route)}</b>
        ${d.branch ? `<span class="muted">branch</span> <code>${esc(d.branch)}</code>` : ""}
        <span class="muted">${esc(d.id)}</span>
        <div style="flex:1"></div>
        ${d.status === "planned" ? `<button class="primary" id="runplan" ${state.busy ? "disabled" : ""}>Run this for real</button>` : ""}
        ${running ? `<button class="danger" id="cancel">Cancel</button>` : ""}
        ${canAccept ? `<button class="primary" id="acc">Accept (stage changes)</button>` : ""}
        ${canAct ? `<button class="danger" id="rej">Reject</button>` : ""}
      </div>
      <div id="actmsg"></div>
      ${running ? `<div class="msg s-running"><span class="pulse"></span>Running: <b>${esc(current ? current.name : "starting")}</b> ${current ? `· ${esc(current.detail)} · ${elapsed(current.started)}` : ""}. Local attempts take about 5–6 minutes on this machine.</div>` : ""}
      ${d.status === "interrupted" ? `<div class="msg s-fail">The genie process stopped unexpectedly. Check the target repo's branch (<code>git status</code>) before starting another run.</div>` : ""}
      ${d.result && d.result.error ? `<div class="msg s-fail">${esc(d.result.error)}</div>` : ""}
      <h3>Why this route</h3>
      <div class="row"><span>Existing-code coverage</span><span class="bar"><i style="width:${Math.min(100, (d.coverage || 0) * 100)}%"></i></span><b>${pct(d.coverage)}</b>
        <span class="muted">· ~${esc(d.estimate?.needed_tokens)} tokens needed of ${esc(d.estimate?.local_budget)} local</span></div>
      <ul class="tight">
        ${reasons.map(r => `<li>Escalate: ${esc(r)}</li>`).join("")}
        ${(d.decisions || []).map(r => `<li>${esc(r)}</li>`).join("")}
        ${d.unknown_terms && d.unknown_terms.length ? `<li class="muted">Terms not found anywhere in the repo: ${esc(d.unknown_terms.join(", "))}</li>` : ""}
      </ul>
      <div class="muted">Files to edit: ${d.editable.map(x => `<code>${esc(x)}</code>`).join(", ") || "none"}</div>
      ${d.edit_mode ? `<div class="muted">Edit mode: <b>${esc(d.edit_mode)}</b> · ${esc(d.edit_mode_why || "")}</div>` : ""}
    </div>
    ${running ? `<div class="card"><h2>Live model output <span class="muted" id="live-name"></span></h2><pre class="live" id="live">Waiting for output…</pre></div>` : ""}
    <div class="card"><h2>Timeline</h2><div class="steps">${(d.steps || []).map(s => `
      <div class="step"><b>${esc(s.name)}</b><span class="chip s-${esc(s.status)}">${esc(s.status)}</span> ${s.seconds != null ? `<span class="muted">${s.seconds}s</span>` : ""}
      <div class="muted">${esc(s.detail)}</div></div>`).join("")}</div></div>
    ${(d.attempts || []).map(a => `
      <div class="card"><h2>Attempt ${a.n}: ${esc(a.kind)} <span class="chip s-${esc(a.verdict)}">${esc(a.verdict)}</span></h2>
        <div class="muted">${esc(a.model)} · ${esc(a.edit_format)} format · ${esc(a.aider.seconds)}s · tokens ${esc(a.aider.tokens_sent || "?")} sent / ${esc(a.aider.tokens_received || "?")} received${a.aider.cost_usd ? ` · ${money(a.aider.cost_usd)}` : ""}${a.aider.timed_out ? " · timed out" : ""}</div>
        ${a.aider.placement && a.aider.placement.length ? `<h3>Where genie placed the code</h3><ul class="tight">${a.aider.placement.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
        ${checksTable(a.checks)}
        ${a.aider.generated ? `<details><summary>Code the model wrote</summary><pre>${esc(a.aider.generated)}</pre></details>` : ""}
        <details><summary>Prompt sent with this attempt</summary><pre>${esc(a.message)}</pre></details>
      </div>`).join("")}
    ${d.remote_payload ? `<div class="card"><h2>What was sent to the remote model</h2>
      <div class="row">${d.remote_payload.blocked ? `<span class="chip s-blocked">blocked</span> ${esc(d.remote_payload.reasons.join("; "))}` : `<span class="chip s-pass">sent</span>`}</div>
      <ul class="tight"><li>Files: ${d.remote_payload.files.map(x => `<code>${esc(x)}</code>`).join(", ")}</li>
      <li>Context packet: ${esc(d.remote_payload.context_chars)} characters (below)</li>
      <li>Repo map: not sent (remote.send_repo_map = false)</li></ul></div>` : ""}
    <div class="card"><h2>Reusable code genie found</h2>
      <table><tr><th>Coverage</th><th>Kind</th><th>Where</th><th>Signature</th></tr>
      ${(d.matches || []).slice(0, 10).map(m => `<tr><td>${pct(m.coverage)}</td><td>${esc(m.kind)}</td><td><code>${esc(m.file)}:${esc(m.line)}</code></td><td><code>${esc(m.sig)}</code></td></tr>`).join("")}</table>
      ${(d.docs || []).length ? `<h3>Docs used</h3><ul class="tight">${d.docs.map(m => `<li>${esc(m.sig)}</li>`).join("")}</ul>` : ""}
    </div>
    ${f["diff.patch"] ? `<div class="card"><h2>Diff ${d.result?.diff_stat ? `<span class="muted">+${d.result.diff_stat.added} −${d.result.diff_stat.removed} in ${d.result.diff_stat.files} file(s)</span>` : ""}</h2><pre class="diff">${diffHtml(f["diff.patch"])}</pre></div>` : ""}
    ${f["context.md"] ? `<div class="card"><details><summary>Context packet (context.md)</summary><pre>${esc(f["context.md"])}</pre></details></div>` : ""}
  `;
  const act = async (kind) => {
    try {
      const r = await post(`/api/${kind}`, { id });
      $("#actmsg").innerHTML = `<div class="msg s-pass">${esc(r.message)}</div>`;
    } catch (e) { $("#actmsg").innerHTML = `<div class="msg s-fail">${esc(e.message)}</div>`; }
    await loadRuns();
  };
  if ($("#acc")) $("#acc").onclick = () => act("accept");
  if ($("#rej")) $("#rej").onclick = () => act("reject");
  if ($("#cancel")) $("#cancel").onclick = () => act("cancel");
  if ($("#runplan")) $("#runplan").onclick = async () => {
    try {
      const o = d.options || {};
      await startTask({ task: d.task, files: (o.files && o.files.length) ? o.files : d.editable,
        local_only: o.local_only, remote: o.remote, fast: o.fast, test: o.test_cmd, mode: o.mode });
    } catch (e) { $("#actmsg").innerHTML = `<div class="msg s-fail">${esc(e.message)}</div>`; }
  };
  if (running) refreshLive(id);
}

$("#newtask").onsubmit = async (e) => {
  e.preventDefault();
  const task = $("#nt-task").value.trim();
  if (!task) return;
  $("#nt-go").disabled = true;
  try {
    await startTask({
      task,
      files: $("#nt-files").value.split(",").map(s => s.trim()).filter(Boolean),
      test: $("#nt-test").value.trim(),
      dry_run: $("#nt-dry").checked, local_only: $("#nt-local").checked,
      fast: $("#nt-fast").checked, remote: $("#nt-remote").checked,
      mode: $("#nt-mode").value || undefined,
    });
    $("#nt-task").value = "";
  } catch (err) { $("#nt-msg").textContent = err.message; }
  $("#nt-go").disabled = false;
};

$("#target").onchange = (e) => { state.target = e.target.value; state.selected = null; loadRuns(); };
$("#refresh").onclick = () => { loadRuns(); if (state.selected) select(state.selected); };
(async () => {
  try { await loadTargets(); await loadRuns(); } catch (e) { $("#list").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  // Poll every 2 s: refresh the list, and the selected run while it is starting or running.
  setInterval(async () => {
    try {
      await loadRuns();
      if (!state.selected) return;
      const r = state.runs.find(x => x.id === state.selected);
      if (!r || r.status === "running") {
        const live = $("#live");
        const keep = live ? live.scrollTop : null;
        await select(state.selected);
        if (keep !== null && $("#live")) $("#live").scrollTop = keep;
      } else if ($("#live")) {
        select(state.selected);  // it just finished: show the final state
      }
    } catch (e) { /* server stopped */ }
  }, 2000);
})();
</script>
</body>
</html>
